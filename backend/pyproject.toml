[project]
name = "cyclone-verification-backend"
version = "0.1.0"
description = "Backend FastAPI service for cyclone verification"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "certifi>=2024.2.2",
    # app/gen_cont_tables.py: contingency tables are built by intersecting
    # the bulletin GeoJSON with town points on the WGS84 ellipsoid.
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Kept as a named extra for callers that want to document PostgreSQL support.
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only `app` is an importable package; `alembic/` holds migration scripts that
# the alembic CLI loads from disk, and `tests/` shouldn't ship.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/towns.xlsx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated output would be undone by the
# next `alembic revision --autogenerate`.
"alembic/versions/*.py" = ["E501", "UP007", "UP035"]
# FastAPI's recommended pattern for file uploads requires a function call
# (File(...)) as the default argument
"app/api/v1/endpoints/*.py" = ["B008"]
# Import is placed after router = APIRouter() intentionally 
# (or needs investigation) - not reordering blind
"app/api/v1/endpoints/config.py" = ["E402"]
# CLI help/docstring text in this file reads better as long lines than
# manually wrapped mid-sentence
"app/gen_cont_tables.py" = ["E501"]
